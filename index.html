<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior AI Engineer Interview OS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h1>🚀 Interview OS</h1>
                <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar">✕</button>
            </div>
            <nav id="sidebar-nav" class="sidebar-nav"></nav>
        </aside>
        <header class="mobile-header">
            <button id="mobile-menu-btn" class="icon-btn">☰</button>
            <span>Interview OS</span>
        </header>
        <main id="main-content" class="main-content">
            <div id="search-bar" class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Search anything... (⌘K)" autocomplete="off">
                <kbd>⌘K</kbd>
                <div id="search-results" class="search-results hidden"></div>
            </div>
            <div id="content" class="content"></div>
        </main>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <div id="flashcard-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-card flashcard-card">
            <div class="flashcard-front" id="flashcard-front"></div>
            <div class="flashcard-back hidden" id="flashcard-back"></div>
            <div class="flashcard-nav">
                <button id="fc-prev" class="btn btn-sm">← Prev</button>
                <span id="fc-counter"></span>
                <button id="fc-next" class="btn btn-sm">Next →</button>
            </div>
            <button id="fc-close" class="btn btn-sm btn-ghost">Close</button>
        </div>
    </div>
    <div id="code-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-card code-modal-card">
            <div class="code-modal-header">
                <span id="code-modal-title">Code</span>
                <button id="code-modal-close" class="icon-btn">✕</button>
            </div>
            <div id="code-modal-body"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
